name: Daily Ads Report

on:
  schedule:
    - cron: "0 1 * * *"      # 每天 UTC 01:00 = 马来西亚时间 09:00 自动跑
  workflow_dispatch: {}        # 也允许在 GitHub 页面上手动点一下立即跑

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 拉取 Meta 广告数据
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/meta_ads_pull.py

      - name: 生成报告页面
        run: |
          cp daily_ads_dashboard.html index.html
          python scripts/build_report.py dashboard_data.json index.html
          mkdir -p _site
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
